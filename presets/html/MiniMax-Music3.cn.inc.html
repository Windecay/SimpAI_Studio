<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>MiniMax Music 3 音乐与歌曲生成</title>
  <style>body{margin:0;font:12px/1.6 sans-serif;color:#1f2937}p{margin:0}</style>
</head>
<body>
  <p>主提示词按 Global Metadata / Vocal Details / Arrangement 三段英文描述曲风、唱法与配器，歌词框使用 [Intro] [Verse] [Chorus] [Outro] 分段填写歌词（纯音乐只写结构标签）。默认输出无损 FLAC，可开启开关输出 MP3 320kbps，并在「音频」波形面板试听与回看词曲元数据。</p>
  <script>
    const stage = Object.fromEntries(new URLSearchParams(location.search));
    if (stage.__theme === 'dark') document.body.style.color = '#f9fafb';
  </script>
</body>
</html>
