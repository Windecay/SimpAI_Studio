[project]
name = "kandinsky-sr-native"
description = "Kandinsky 6.0 Video Super-Resolution 2.0 and Kandinsky ImageSR 2.0 by kandinskylab, natively in ComfyUI: upscale videos x2, x2.25 or x4 and images x2 or x4 on ComfyUI's memory management, with exact and fast kernels and bf16 or int8 ConvRot files."
version = "1.0.0"
license = { file = "LICENSE" }
requires-python = ">=3.10"
classifiers = ["Operating System :: OS Independent", "Environment :: GPU :: NVIDIA CUDA"]
dependencies = []

[project.urls]
Repository = "https://github.com/PedroMarinhoDev/ComfyUI-KandinskySR"
Documentation = "https://github.com/PedroMarinhoDev/ComfyUI-KandinskySR#readme"
"Bug Tracker" = "https://github.com/PedroMarinhoDev/ComfyUI-KandinskySR/issues"
"Model files" = "https://huggingface.co/PedroMarinhoDev/Kandinsky-SR-ComfyUI"

[tool.comfy]
PublisherId = "pedromarinhodev"
DisplayName = "Kandinsky SR (video and image super-resolution)"
Icon = "https://raw.githubusercontent.com/PedroMarinhoDev/ComfyUI-KandinskySR/main/assets/registry-icon.png"
Banner = "https://raw.githubusercontent.com/PedroMarinhoDev/ComfyUI-KandinskySR/main/assets/registry-banner.png"
requires-comfyui = ">=0.44.0"
